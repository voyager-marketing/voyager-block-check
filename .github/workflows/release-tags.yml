name: Release tags

# Consumers pin `voyager-marketing/voyager-block-check@v1`.
# `v1` moves only when a v1.x.y GitHub Release is published, never on a push to main.
# `workflow_dispatch` re-points `v1` at an existing release tag (a retry, or a rollback).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to point v1 at (for example v1.0.1)
        required: true

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ github.event.release.tag_name || inputs.tag }}

      - name: Move v1 to the release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v1\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$RELEASE_TAG is not a v1.x.y tag, v1 is unchanged."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f v1 HEAD
          git push -f origin v1
          echo "v1 -> $RELEASE_TAG ($(git rev-parse --short HEAD))" >> "$GITHUB_STEP_SUMMARY"
